name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Compact Compiler
        uses: midnightntwrk/setup-compact-action@v0.31.0
        with:
          compact-version: '0.31.0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Update NPM
        run: npm install -g npm@latest

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Compile & Test Compact Smart Contract
        working-directory: contract
        run: npm run ci

      - name: Build & Test API Client
        working-directory: api
        run: npm run ci

      - name: Build & Test CLI
        working-directory: bboard-cli
        run: npm run ci

      - name: Build & Test Web UI
        working-directory: bboard-ui
        run: npm run ci
